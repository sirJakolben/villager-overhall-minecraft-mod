license="${mod_license}"

[[mods]]
modId="${villager_mod_id}"
version="${villager_mod_version}"
displayName="${villager_mod_name}"
authors="sirJakolben"
description='''
Small quality-of-life additions for Vanilla villagers: lure them with an emerald, assign them to a workplace with an emerald, call them to a Trading Block with redstone. Zombie villagers spawn twice as often and a weakness effect is enough to start curing them; naturally generated brewing stands start with fuel.
'''

[[mixins]]
config="${villager_mod_id}.mixins.json"

[[dependencies.${villager_mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${villager_mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
