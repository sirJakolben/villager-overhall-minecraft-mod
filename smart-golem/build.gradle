plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = golem_mod_version
group = golem_mod_group_id

base {
    archivesName = golem_mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    exclude("**/*.bbmodel")
}

neoForge {
    version = project.neo_version

    runs {
        // Smart Iron Golem alone - its own folder.
        client {
            client()
            gameDirectory = rootProject.file('run-golem')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.file('run-golem-server')
        }

        // Loads the mod headless and runs its gametests, then stops.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = rootProject.file("run-gametest-golem")
            systemProperty "neoforge.enabledGameTestNamespaces", project.golem_mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${golem_mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_license            : mod_license,
            golem_mod_id           : golem_mod_id,
            golem_mod_name         : golem_mod_name,
            golem_mod_version      : golem_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Dev tool, not part of the mod: bakes the climb animation of the Blockbench project into tables (src/bake, tools/bake-climb.md).
sourceSets {
    bake {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

tasks.register('bakeClimb', JavaExec) {
    group = 'tools'
    description = 'Bakes assets/Block References/iron_golem/iron_golem.bbmodel into ClimbPose.java'
    classpath = sourceSets.bake.runtimeClasspath
    mainClass = 'com.smartgolem.client.BakeClimb'
    args rootProject.file('assets/Block References/iron_golem/iron_golem.bbmodel').absolutePath,
            file('src/main/java/com/smartgolem/climb').absolutePath
}
