pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'improved-villagers'

include 'smart-villager'
include 'smart-villager-progress'
include 'smart-villager-professions'
include 'smart-golem'
