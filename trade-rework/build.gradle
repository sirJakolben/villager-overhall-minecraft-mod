plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

// The core's source set is referenced in the mods block below (same pattern as ModDevGradle's own test project).
evaluationDependsOn(':core')

version = ext_mod_version
group = ext_mod_group_id

base {
    archivesName = ext_mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    exclude("**/*.bbmodel")
}

neoForge {
    version = project.neo_version

    runs {
        // The full game: core + Trade Rework. Uses the old run/ folder, so the existing test worlds keep working.
        client {
            client()
            gameDirectory = rootProject.file('run')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.file('run-server')
        }

        // Loads both mods and all datapack files headless, then stops - a quick load check.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = rootProject.file("run-gametest")
            systemProperty "neoforge.enabledGameTestNamespaces", project.ext_mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(project(':core').sourceSets.main)
        }
        "${ext_mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // compileOnly: at runtime the core is loaded from its own source set (mods block above); as a jar on the
    // classpath it would be found twice.
    compileOnly project(":core")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_license            : mod_license,
            core_mod_id            : mod_id,
            core_mod_version       : mod_version,
            ext_mod_id             : ext_mod_id,
            ext_mod_name           : ext_mod_name,
            ext_mod_version        : ext_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
